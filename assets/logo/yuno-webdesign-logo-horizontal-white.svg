<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" role="img" aria-label="yuno-webdesign ロゴ（横組み・白反転）">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&amp;family=Roboto:wght@500&amp;display=swap');
      .word-yuno { font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 42px; fill: #6fd0b4; letter-spacing: 0.02em; }
      .word-rest { font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 42px; fill: #ffffff; letter-spacing: 0.01em; }
      .word-sub  { font-family: 'Roboto', Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #cfcfcf; letter-spacing: 0.22em; }
    </style>
  </defs>

  <g transform="translate(12,15)">
    <polygon points="50,6 94,50 50,94 6,50" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 34,27 C 40,34 46,41 50,47 L 50,86
