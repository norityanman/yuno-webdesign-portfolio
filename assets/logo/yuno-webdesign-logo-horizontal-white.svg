             M 50,62 A 13 13 0 1 0 50,86"
          fill="none" stroke="#6fd0b4" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(132,0)">
    <text x="0" y="70" class="word-yuno">yuno</text>
    <text x="92" y="70" class="word-rest">-webdesign</text>
    <rect x="0" y="76" width="88" height="2" fill="#6fd0b4" opacity="0.8"/>
    <text x="1" y="100" class="word-sub">WEB DESIGN &amp; BRANDING</text>
